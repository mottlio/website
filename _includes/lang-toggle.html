<button id="lang-toggle" class="lang-toggle" type="button" aria-label="Switch language / Zmień język"><span data-lang="en">EN</span><span data-lang="pl">PL</span></button>
<script>
(function () {
  const KEY = 'mottl_lang';
  const btn = document.getElementById('lang-toggle');

  // Move the switch into the navbar: before the mobile menu toggler, shown last on desktop via CSS order.
  const container = document.querySelector('.navbar .navbar-container');
  if (btn && container) container.insertBefore(btn, container.querySelector('.navbar-toggler'));

  function applyNav(lang) {
    const map = {
      en: { '/index.html': 'Home', '/': 'Home', '/services.html': 'Work with me', '/about.html': 'About', '/posts.html': 'Blog posts' },
      pl: { '/index.html': 'Start', '/': 'Start', '/services.html': 'Współpraca', '/about.html': 'O mnie', '/posts.html': 'Blog (EN)' }
    };
    // Only nav items; the brand link also points to /index.html and must keep the site name.
    document.querySelectorAll('.navbar .nav-link[href]').forEach(a => {
      try {
        const p = new URL(a.href, window.location.origin).pathname;
        const label = a.querySelector('.menu-text') || a;
        if (map[lang][p]) label.textContent = map[lang][p];
      } catch (_) {}
    });
  }

  function setLang(lang) {
    document.documentElement.lang = lang;
    document.querySelectorAll('.lang-en').forEach(el => el.style.display = (lang === 'en' ? '' : 'none'));
    document.querySelectorAll('.lang-pl').forEach(el => el.style.display = (lang === 'pl' ? '' : 'none'));
    applyNav(lang);
    if (btn) btn.querySelectorAll('span').forEach(s => s.classList.toggle('active', s.dataset.lang === lang));
    try { localStorage.setItem(KEY, lang); } catch (_) {}
  }

  async function detectLang() {
    let saved = null;
    try { saved = localStorage.getItem(KEY); } catch (_) {}
    if (saved === 'pl' || saved === 'en') return saved;
    try {
      const controller = new AbortController();
      const t = setTimeout(() => controller.abort(), 1800);
      const res = await fetch('https://ipapi.co/json/', { signal: controller.signal });
      clearTimeout(t);
      if (res.ok) {
        const data = await res.json();
        if ((data && data.country_code) === 'PL') return 'pl';
      }
    } catch (_) {}
    return (navigator.language || '').toLowerCase().startsWith('pl') ? 'pl' : 'en';
  }

  if (btn) {
    btn.addEventListener('click', () => {
      const current = document.documentElement.lang === 'pl' ? 'pl' : 'en';
      setLang(current === 'pl' ? 'en' : 'pl');
    });
  }

  detectLang().then(setLang);
})();
</script>
